name: PR Validation

on:
  pull_request:
    branches:
      - main
      - development

jobs:
  validate:
    name: Flutter Analyze, Format, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Write dummy environment
        run: |
          {
            echo "EXPO_PUBLIC_FIREBASE_API_KEY=dummy"
            echo "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=dummy"
            echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID=dummy"
            echo "EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=dummy"
            echo "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=dummy"
            echo "EXPO_PUBLIC_FIREBASE_APP_ID=dummy"
            echo "EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=dummy"
            echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=dummy"
            echo "EXPO_PUBLIC_FIREBASE_USE_EMULATOR=false"
            echo "ONEWALLET_ENABLE_EMAIL_PASSWORD_AUTH=false"
          } > .env
          cp .env config.env

      - name: Verify Formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze Code
        run: flutter analyze --no-fatal-infos

      - name: Run Tests
        run: flutter test

  validate-pwa:
    name: PWA Lint, Typecheck, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install PWA dependencies
        working-directory: pwa
        run: npm ci

      - name: Write dummy environment
        working-directory: pwa
        run: |
          {
            echo "VITE_FIREBASE_API_KEY=dummy"
            echo "VITE_FIREBASE_AUTH_DOMAIN=dummy"
            echo "VITE_FIREBASE_PROJECT_ID=dummy"
            echo "VITE_FIREBASE_STORAGE_BUCKET=dummy"
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=dummy"
            echo "VITE_FIREBASE_APP_ID=dummy"
            echo "VITE_GOOGLE_WEB_CLIENT_ID=dummy"
          } > .env

      - name: Run PWA tests
        working-directory: pwa
        run: npm test

      - name: Lint
        working-directory: pwa
        run: npm run lint

      - name: Build (typecheck + bundle)
        working-directory: pwa
        run: npm run build

  validate-firestore-rules:
    name: Firestore Security Rules Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - name: Install Firebase rules test dependencies
        run: npm ci --prefix firebase

      - name: Run Firestore rules tests in the emulator
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-1wallet-rules "npm --prefix firebase test"
