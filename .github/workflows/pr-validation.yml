name: PR Validation

on:
  pull_request:
    branches:
      - main
      - development

jobs:
  validate:
    name: Flutter Analyze, Format, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Write dummy environment
        run: |
          {
            echo "EXPO_PUBLIC_FIREBASE_API_KEY=dummy"
            echo "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=dummy"
            echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID=dummy"
            echo "EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=dummy"
            echo "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=dummy"
            echo "EXPO_PUBLIC_FIREBASE_APP_ID=dummy"
            echo "EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=dummy"
            echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=dummy"
            echo "EXPO_PUBLIC_FIREBASE_USE_EMULATOR=false"
            echo "ONEWALLET_ENABLE_EMAIL_PASSWORD_AUTH=false"
          } > .env
          cp .env config.env

      - name: Verify Formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test
