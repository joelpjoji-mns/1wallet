name: iOS App Store Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes
        required: false
        type: string

jobs:
  release-ios:
    name: Build & Publish iOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Validate release signing secrets
        run: |
          missing=()
          [ -z "${{ secrets.APPLE_TEAM_ID }}" ] && missing+=("APPLE_TEAM_ID")
          [ -z "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}" ] && missing+=("IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64")
          [ -z "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}" ] && missing+=("IOS_DISTRIBUTION_CERTIFICATE_PASSWORD")
          [ -z "${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}" ] && missing+=("APP_STORE_CONNECT_API_KEY_ISSUER_ID")
          [ -z "${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}" ] && missing+=("APP_STORE_CONNECT_API_KEY_KEY_ID")
          [ -z "${{ secrets.APP_STORE_CONNECT_API_KEY_PRIVATE_KEY }}" ] && missing+=("APP_STORE_CONNECT_API_KEY_PRIVATE_KEY")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required repository secret(s): ${missing[*]}. Configure them in repo Settings > Secrets before running this workflow."
            exit 1
          fi
          echo "All required release signing secrets are present."

      - name: Flutter dependencies
        run: flutter pub get

      - name: Write mobile environment
        run: |
          {
            echo "EXPO_PUBLIC_FIREBASE_API_KEY=${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}"
            echo "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}"
            echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}"
            echo "EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}"
            echo "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}"
            echo "EXPO_PUBLIC_FIREBASE_APP_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}"
            echo "EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}"
            echo "EXPO_PUBLIC_FIREBASE_USE_EMULATOR=false"
            echo "ONEWALLET_ENABLE_EMAIL_PASSWORD_AUTH=false"
          } > .env
          cp .env config.env

      - name: Import signing certificate
        # Headless CI has no signed-in Apple ID session, so Xcode's automatic
        # "-allowProvisioningUpdates" provisioning management cannot silently
        # authenticate. Manual signing with an imported distribution
        # certificate + a downloaded provisioning profile is the reliable,
        # Apple-supported unattended path (this action is maintained by
        # Apple-Actions, the org Apple references for CI/CD sample workflows).
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Download provisioning profile
        id: profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.joelpjoji.one.wallet
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_PRIVATE_KEY }}

      - name: Prepare ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ fromJson(steps.profile.outputs.profiles)[0].name }}
        run: |
          set -euo pipefail
          cp ios/ExportOptions.plist ios/ExportOptions.generated.plist
          plutil -replace teamID -string "$APPLE_TEAM_ID" ios/ExportOptions.generated.plist
          # plutil keypaths are KVC-style and split on every ".", so a bundle
          # ID key (which itself contains dots, e.g. com.joelpjoji.one.wallet)
          # cannot be addressed as a nested keypath component
          # (provisioningProfiles.com.joelpjoji.one.wallet would be parsed as
          # 4 nested dictionary levels, not one literal key). Replacing the
          # whole provisioningProfiles value with a JSON fragment sidesteps
          # keypath parsing entirely and is unambiguous.
          profile_json=$(jq -n --arg name "$PROFILE_NAME" '{"com.joelpjoji.one.wallet": $name}')
          plutil -replace provisioningProfiles -json "$profile_json" ios/ExportOptions.generated.plist

      - name: Build & export IPA
        env:
          # Consumed by ios/Flutter/Release.xcconfig so the archive step
          # (which flutter build ipa runs with -allowProvisioningUpdates) has
          # a resolved DEVELOPMENT_TEAM/manual signing identity available and
          # does not need to reach out to Apple's provisioning service.
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_SPECIFIER: ${{ fromJson(steps.profile.outputs.profiles)[0].name }}
          IOS_CODE_SIGN_STYLE: Manual
          IOS_CODE_SIGN_IDENTITY: Apple Distribution
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.generated.plist
        # Produces build/ios/archive/Runner.xcarchive and build/ios/ipa/*.ipa.

      - name: Upload to App Store Connect
        env:
          API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          API_KEY_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # `xcrun altool --upload-app` is deprecated/removed by Apple. The
          # current Apple-supported unattended upload path is `xcodebuild
          # -exportArchive` against the already-built .xcarchive with
          # `destination = upload` and App Store Connect API key
          # authentication (-authenticationKeyPath/-authenticationKeyID/
          # -authenticationKeyIssuerID), which xcodebuild has supported
          # natively since Xcode 13.
          key_dir="$RUNNER_TEMP/private_keys"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey_${API_KEY_KEY_ID}.p8"
          printf '%s' "$API_KEY_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"

          upload_plist="$RUNNER_TEMP/ExportOptionsUpload.plist"
          cp ios/ExportOptions.generated.plist "$upload_plist"
          plutil -replace destination -string upload "$upload_plist"

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$upload_plist" \
            -exportPath "$RUNNER_TEMP/upload" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$API_KEY_KEY_ID" \
            -authenticationKeyIssuerID "$API_KEY_ISSUER_ID"

          rm -f "$key_path"
