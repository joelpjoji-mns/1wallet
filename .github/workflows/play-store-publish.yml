name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track to deploy to'
        required: true
        default: 'alpha'
        type: choice
        options:
          - internal
          - alpha
          - production
      status:
        description: 'Release status (completed or draft)'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Upload to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup Environment & Google Services
        run: |
          # Create config.env
          cat << 'EOF' > config.env
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID || 'wallet-1a5af' }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          EOF

          # Restore google-services.json if provided in secrets
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d -i > android/app/google-services.json
          fi

      - name: Restore Keystore & Signing Properties
        env:
          KEY_ALIAS: ${{ secrets.ONEWALLET_RELEASE_KEY_ALIAS }}
          STORE_PWD: ${{ secrets.ONEWALLET_RELEASE_STORE_PASSWORD }}
          KEY_PWD: ${{ secrets.ONEWALLET_RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "${{ secrets.ONEWALLET_RELEASE_KEYSTORE_BASE64 }}" | base64 -d -i > android/upload-keystore.jks
          python3 -c '
          import os
          store_pwd = os.environ.get("STORE_PWD", "").encode("utf-8").decode("utf-8-sig").strip()
          key_alias = os.environ.get("KEY_ALIAS", "").encode("utf-8").decode("utf-8-sig").strip()
          key_pwd = os.environ.get("KEY_PWD", "").encode("utf-8").decode("utf-8-sig").strip()
          with open("android/release-signing.properties.local", "w", encoding="utf-8") as f:
              f.write("ONEWALLET_RELEASE_STORE_FILE=upload-keystore.jks\n")
              f.write(f"ONEWALLET_RELEASE_STORE_PASSWORD={store_pwd}\n")
              f.write(f"ONEWALLET_RELEASE_KEY_ALIAS={key_alias}\n")
              f.write(f"ONEWALLET_RELEASE_KEY_PASSWORD={key_pwd}\n")
          '

      - name: Build Release App Bundle
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.joelpjoji.one.wallet
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'alpha' }}
          status: ${{ github.event.inputs.status || 'completed' }}
