# Disable persistent daemon so Java terminates as soon as the build finishes
org.gradle.daemon=false
org.gradle.daemon.idletimeout=15000

org.gradle.jvmargs=-XX:+IgnoreUnrecognizedVMOptions --enable-native-access=ALL-UNNAMED -Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 built-in Kotlin/new DSL is the future default, but current Flutter/Firebase
# plugin subprojects still apply org.jetbrains.kotlin.android and Flutter's Gradle
# plugin currently fails without the old DSL fallback. Keep these temporary opt-outs
# until those plugins migrate, otherwise Android builds fail during configuration.
android.newDsl=false
android.builtInKotlin=false
